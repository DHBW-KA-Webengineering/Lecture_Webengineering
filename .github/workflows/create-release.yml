name: Create Release on Push to current year branch

on:
  push:
    branches:
      - "2026"
      # Temporary: validate the build on this CI fix branch (no release is created
      # because the create_release job is guarded by refs/heads/2026). Remove on merge.
      - "ci/fix-slide-build"
  workflow_dispatch:

jobs:
  build_pdf:
    runs-on: ubuntu-latest
    container: ghcr.io/lukaspanni/pandoc-builder:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Diagnose slide build (temporary)
        shell: pwsh
        continue-on-error: true
        run: |
          pandoc -f markdown+smart+yaml_metadata_block+rebase_relative_paths --slide-level 2 -t beamer -H preamble.tex -F pandoc-plantuml -o diag.tex Material/Slides/01_Vorstellung_Intro.md
          lualatex -interaction=nonstopmode -halt-on-error diag.tex 2>&1 | Select-String -Pattern "! |not found|metropolis|fatal|Emergency" -Context 1,3
      - name: Build PDFs
        shell: pwsh
        run: ./build.ps1
      - name: Show Repo Content
        run: ls -R
      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdf-output
          path: build.zip

  create_release:
    needs: build_pdf
    if: ${{ github.ref == 'refs/heads/2026' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Download PDF artifacts
        uses: actions/download-artifact@v4
        with:
          name: pdf-output
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -R
          gh release create $(date +'%Y-%m-%d-%H-%M') build.zip --generate-notes
