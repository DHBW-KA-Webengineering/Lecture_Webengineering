name: Create Release on Push to current year branch

on:
  push:
    branches:
      - "2027"
  workflow_dispatch:

jobs:
  build_pdf:
    runs-on: ubuntu-latest
    container: ghcr.io/lukaspanni/pandoc-builder:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install slide beamer theme
        shell: pwsh
        # The container ships TeX Live 2024; tlmgr's default mirror is the current
        # release and refuses cross-release installs, so pin the 2024 historic repo.
        # metropolis pulls in pgfopts and defaults to the Fira fonts.
        run: |
          tlmgr option repository https://ftp.math.utah.edu/pub/tex/historic/systems/texlive/2024/tlnet-final
          tlmgr install beamertheme-metropolis pgfopts fira
      - name: Build PDFs
        shell: pwsh
        run: ./build.ps1
      - name: Show Repo Content
        run: ls -R
      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdf-output
          path: build.zip

  create_release:
    needs: build_pdf
    if: ${{ github.ref == 'refs/heads/2026' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Download PDF artifacts
        uses: actions/download-artifact@v4
        with:
          name: pdf-output
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -R
          gh release create $(date +'%Y-%m-%d-%H-%M') build.zip --generate-notes
